<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>YUSUF</title>
  </head>
  <body>
    <div class="container app-wrapper">
      <div class="header-bar">
        <h2 class="shop-heading text-center">ASGHAR ALI (RINKU)</h2>
        <p class="sub-heading text-center">Hospital Road, Near Sadhu Medical · Siwan</p>
      </div>

      <button class="btn btn-success generate-btn" id="generate-invoice">
        <i class="fas fa-file-invoice"></i> Generate Invoice
      </button>

      <div class="row g-4">
        <!-- LEFT: FORM -->
        <div class="col-md-6">
          <div class="card ui-card">
            <div class="card-header ui-card-header">
              <i class="fas fa-plus-circle"></i> Add Item
            </div>
            <div class="card-body">
              <form action="" id="item-form">
                <div class="form-group mb-3">
                  <label for="customer-name" class="form-label">
                    <i class="fas fa-user"></i> Bill To
                  </label>
                  <input type="text" class="form-control ui-input" id="customer-name" placeholder="Customer name" />
                </div>
                <div class="form-group mb-3">
                  <label for="item-name" class="form-label">
                    <i class="fas fa-box"></i> Item Name
                  </label>
                  <input type="text" class="form-control ui-input" id="item-name" placeholder="Item name" />
                </div>
                <div class="row">
                  <div class="col-6">
                    <div class="form-group mb-3">
                      <label for="item-qty" class="form-label">
                        <i class="fas fa-hashtag"></i> Qty
                      </label>
                      <input type="text" class="form-control ui-input" id="item-qty" placeholder="Qty" />
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="form-group mb-3">
                      <label for="item-price" class="form-label">
                        <i class="fas fa-rupee-sign"></i> Price
                      </label>
                      <input type="text" class="form-control ui-input" id="item-price" placeholder="Price" />
                    </div>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary ui-add-btn w-100">
                  <i class="fas fa-cart-plus"></i> Add To Cart
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- RIGHT: CART + TOTALS -->
        <div class="col-md-6">
          <div class="card ui-card mb-3">
            <div class="card-header ui-card-header">
              <i class="fas fa-shopping-cart"></i> Cart
            </div>
            <div class="card-body p-0">
              <table class="table ui-table mb-0" id="cart-table">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Amount</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="card ui-card">
            <div class="card-header ui-card-header">
              <i class="fas fa-calculator"></i> Summary
            </div>
            <div class="card-body">
              <div class="summary-row">
                <span>Total Qty</span>
                <span id="total-qty">0</span>
              </div>
              <div class="summary-row">
                <span>Amount</span>
                <span id="total-cost">₹0.00</span>
              </div>

              <hr />

              <div class="form-group mb-2">
                <label for="prev-dues" class="form-label">Prev Dues</label>
                <input type="text" class="form-control ui-input" id="prev-dues" placeholder="0" />
              </div>
              <div class="form-group mb-2">
                <label for="amount-paid" class="form-label">Amount Paid</label>
                <input type="text" class="form-control ui-input" id="amount-paid" placeholder="0" />
              </div>

              <div class="summary-row due-row">
                <span>Current Due</span>
                <span id="current-due">₹0.00</span>
              </div>
              <div class="summary-row total-row">
                <span>TOTAL</span>
                <span id="total-amount">₹0.00</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"
      integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
